services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CADGEN_OUTPUT_DIR=/tmp/cadgen_outputs
      - CADGEN_SANDBOX_URL=http://cad-sandbox:8001
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - cadgen_outputs:/tmp/cadgen_outputs
    depends_on:
      - cad-sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cad-sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      uvicorn sandbox_api:app
      --host 0.0.0.0
      --port 8001
      --workers 2
    environment:
      - CADGEN_OUTPUT_DIR=/tmp/cadgen_outputs
    volumes:
      - cadgen_outputs:/tmp/cadgen_outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  cadgen_outputs:
